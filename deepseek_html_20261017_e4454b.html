<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Занятие 3. Переменные и ввод данных — 20 задач</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg: #eef2f9; --card: #ffffff; --ink: #0f172a; --muted: #475569;
    --line: #e2e8f0; --brand: #3b82f6; --brand-d: #1d4ed8;
    --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
  }
  body{
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.6; padding: 1.5rem 1rem;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; }

  header.top{
    background: linear-gradient(120deg, #1e3a8a, #3b82f6);
    color: #fff; padding: 1.5rem 1.8rem; border-radius: 22px;
    box-shadow: 0 12px 30px -14px rgba(0,0,0,.4); margin-bottom: 1.2rem;
  }
  header.top h1{ font-size: 1.5rem; letter-spacing: -.4px; }
  header.top p{ opacity: .92; font-size: .95rem; margin-top: .3rem; }

  .status-bar{
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: .8rem 1.1rem; margin-bottom: 1.2rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap;
    box-shadow: 0 8px 20px -18px rgba(15,23,42,.3);
    position: sticky; top: .5rem; z-index: 30;
  }
  .status-bar .prog{ font-weight: 600; color: var(--brand-d); }
  .status-bar .prog span{ color: var(--ok); }
  .status-bar .badge-info{ font-size: .85rem; color: var(--muted); }

  .filter-bar{
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: .6rem .9rem; margin-bottom: 1rem;
    display: flex; gap: .4rem; flex-wrap: wrap; align-items: center;
  }
  .filter-bar b{ font-size: .9rem; color: var(--muted); margin-right: .3rem; }
  .filter-bar button{
    border: 1px solid var(--line); background: #f8fafc; color: var(--ink);
    padding: .35rem .8rem; border-radius: 999px; cursor: pointer;
    font-size: .85rem; font-weight: 600;
  }
  .filter-bar button.active{ background: var(--brand); color: #fff; border-color: var(--brand); }

  .task{
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 1.4rem 1.6rem; margin-bottom: 1.4rem;
    box-shadow: 0 14px 30px -26px rgba(15,23,42,.35);
    transition: border-color .2s, background .2s;
  }
  .task.solved{
    border-color: var(--ok);
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 60%);
  }
  .task.hidden{ display: none; }

  .task-head{
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem;
  }
  .task-title{
    font-size: 1.15rem; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  }
  .task-title .num{
    background: var(--brand); color: #fff; min-width: 2rem; height: 2rem;
    padding: 0 .6rem; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .95rem;
  }
  .difficulty{
    font-size: .78rem; padding: .2rem .65rem; border-radius: 999px;
    font-weight: 700; letter-spacing: .3px;
  }
  .diff-1{ background: #dcfce7; color: #166534; }
  .diff-2{ background: #fef3c7; color: #92400e; }
  .diff-3{ background: #fee2e2; color: #991b1b; }

  .tag-input{
    font-size: .72rem; padding: .15rem .55rem; border-radius: 999px;
    background: #e0e7ff; color: #3730a3; font-weight: 700;
  }

  .task-desc{ color: #1e293b; margin-bottom: .9rem; font-size: 1rem; }
  .task-desc code{
    background: #eef2f6; padding: .1rem .45rem; border-radius: 6px;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: .9em;
  }

  .io-block{
    background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px;
    padding: .7rem 1rem; margin-bottom: .9rem; font-size: .9rem;
  }
  .io-block b{ color: var(--brand-d); }
  .io-block pre{
    background: #0f172a; color: #e2e8f0; padding: .6rem .8rem;
    border-radius: 8px; margin: .35rem 0 0;
    font-family: 'JetBrains Mono', monospace; font-size: .85rem;
    overflow-x: auto; white-space: pre-wrap;
  }

  .stdin-block{
    background: #fffbeb; border: 1px dashed #fcd34d; border-radius: 12px;
    padding: .6rem .9rem; margin-bottom: .9rem; font-size: .9rem;
  }
  .stdin-block label{ font-weight: 600; color: #92400e; display: block; margin-bottom: .3rem; }
  .stdin-block textarea{
    width: 100%; background: #fff; border: 1px solid #fcd34d;
    border-radius: 8px; padding: .5rem .7rem;
    font-family: 'JetBrains Mono', monospace; font-size: .9rem;
    min-height: 44px; resize: vertical;
  }

  .editor-wrap{
    display: flex; gap: 0; margin-bottom: .8rem;
    border: 1px solid #1e293b; border-radius: 12px; overflow: hidden;
    background: #0f172a;
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 14px; line-height: 1.55;
    position: relative;
  }
  .line-numbers{
    background: #1e293b; color: #64748b; padding: .7rem .6rem;
    text-align: right; user-select: none; font-size: 13px;
    line-height: 1.55; min-width: 2.8rem; white-space: pre;
    overflow: hidden;
  }
  .editor-wrap textarea{
    flex: 1; background: transparent; color: #e2e8f0; border: none;
    outline: none; padding: .7rem .9rem; resize: vertical;
    font-family: inherit; font-size: inherit; line-height: inherit;
    min-height: 130px; tab-size: 4; white-space: pre;
    overflow-wrap: normal; overflow-x: auto;
    caret-color: #60a5fa;
  }
  .editor-wrap textarea::selection{ background: #3b82f6; color: #fff; }
  .editor-wrap textarea:focus{ background: rgba(59,130,246,.05); }

  .actions{
    display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .4rem;
  }
  button{
    font-family: inherit; border: 1px solid var(--line);
    background: #f1f5f9; color: var(--ink);
    padding: .5rem 1rem; border-radius: 10px; cursor: pointer;
    font-size: .92rem; font-weight: 600; transition: all .15s;
  }
  button:hover{ background: #e2e8f0; }
  button.primary{
    background: var(--brand); color: #fff; border-color: var(--brand);
  }
  button.primary:hover{ background: var(--brand-d); }
  button.ghost{ background: #fff; }
  button.hint-btn{
    background: #fef9e7; border-color: #fcd34d; color: #92400e;
  }
  button.hint-btn:hover{ background: #fef3c7; }

  .output{
    margin-top: .7rem; border-radius: 12px; padding: .85rem 1rem;
    font-size: .93rem; line-height: 1.5; display: none;
  }
  .output.show{ display: block; }
  .output.ok{ background: #f0fdf4; border-left: 5px solid var(--ok); color: #064e3b; }
  .output.fail{ background: #fff5f5; border-left: 5px solid var(--danger); color: #7f1d1d; }
  .output.warn{ background: #fef9e7; border-left: 5px solid var(--warn); color: #78350f; }
  .output .label{
    display: inline-block; font-weight: 700;
    padding: .1rem .55rem; border-radius: 6px;
    margin-bottom: .4rem; font-size: .8rem;
  }
  .output.ok .label{ background: var(--ok); color: #fff; }
  .output.fail .label{ background: var(--danger); color: #fff; }
  .output.warn .label{ background: var(--warn); color: #fff; }
  .output pre{
    background: #0f172a; color: #e2e8f0;
    padding: .6rem .8rem; border-radius: 8px;
    margin-top: .4rem; font-family: 'JetBrains Mono', monospace;
    font-size: .85rem; overflow-x: auto; white-space: pre-wrap;
  }

  .hint-box{
    display: none; margin-top: .6rem; background: #fef9e7;
    border-left: 5px solid var(--warn); border-radius: 10px;
    padding: .8rem 1rem; color: #78350f; font-size: .95rem;
  }
  .hint-box.show{ display: block; }
  .hint-box ol{ padding-left: 1.4rem; margin-top: .3rem; }
  .hint-box li{ margin-bottom: .3rem; }

  .solution-box{
    display: none; margin-top: .6rem; background: #ecfdf5;
    border-left: 5px solid var(--ok); border-radius: 10px;
    padding: .8rem 1rem; color: #064e3b; font-size: .95rem;
  }
  .solution-box.show{ display: block; }
  .solution-box pre{
    background: #0f172a; color: #e2e8f0;
    padding: .7rem .9rem; border-radius: 8px;
    margin-top: .5rem; font-family: 'JetBrains Mono', monospace;
    font-size: .88rem; overflow-x: auto; white-space: pre-wrap;
  }

  .badge-solved{
    background: var(--ok); color: #fff; font-size: .8rem;
    padding: .2rem .7rem; border-radius: 999px; font-weight: 700;
  }

  .footer-note{
    text-align: center; color: var(--muted);
    font-size: .88rem; margin: 2rem 0 1rem;
  }

  @media (max-width: 600px){
    body{ padding: 1rem .6rem; }
    header.top{ padding: 1.1rem 1.2rem; }
    header.top h1{ font-size: 1.15rem; }
    .task{ padding: 1.1rem 1rem; }
    .task-title{ font-size: 1rem; }
    .editor-wrap{ font-size: 13px; }
  }
</style>

<div class="wrap">

  <header class="top">
    <h1>🐍 Занятие 3. Переменные и ввод данных — 20 задач</h1>
    <p>Код запускается прямо в браузере. Проверка сверяет реальный вывод с ожидаемым.</p>
  </header>

  <div class="status-bar">
    <div class="prog">Решено: <span id="solvedCount">0</span> / <span id="totalCount">0</span></div>
    <div class="badge-info">Tab = 4 пробела · Ctrl+Enter = запуск</div>
  </div>

  <div class="filter-bar" id="filterBar">
    <b>Фильтр:</b>
    <button data-filter="all" class="active">Все</button>
    <button data-filter="1">Легко</button>
    <button data-filter="2">Средне</button>
    <button data-filter="3">Сложно</button>
    <button data-filter="solved">Решённые</button>
    <button data-filter="unsolved">Не решённые</button>
  </div>

  <div id="tasks"></div>

  <div class="footer-note">Совет: сначала попробуй сам, потом смотри подсказки. Решение откроется только после победы.</div>
</div>

<script>
/* =============================================================
   МИНИ-ИНТЕРПРЕТАТОР PYTHON (JavaScript) — с поддержкой типов
   ============================================================= */
function runPythonMini(code, stdinLines){
  stdinLines = stdinLines || [];
  let stdinIndex = 0;

  const output = [];
  const vars = Object.create(null);
  const floatVars = new Set(); // переменные, которые хранят float

  function pyRepr(v, forceFloat = false){
    if (typeof v === 'string') return v;
    if (typeof v === 'boolean') return v ? 'True' : 'False';
    if (typeof v === 'number') {
      if (forceFloat) {
        if (!Number.isInteger(v)) return String(v);
        return v.toFixed(1); // 6 -> "6.0"
      }
      return String(v);
    }
    if (v === null || v === undefined) return 'None';
    return String(v);
  }

  // Помечаем переменную как float, если она результат деления или float()
  function setVar(name, val, isFloat = false) {
    vars[name] = val;
    if (isFloat) floatVars.add(name);
    else floatVars.delete(name);
  }

  function prepareExpr(expr){
    let jsExpr = expr;

    // ** → Math.pow(a, b)
    let prev;
    do {
      prev = jsExpr;
      jsExpr = jsExpr.replace(
        /(-?\d+\.?\d*|[A-Za-z_]\w*|\([^()]*\))\s*\*\*\s*(-?\d+\.?\d*|[A-Za-z_]\w*|\([^()]*\))/g,
        'Math.pow($1, $2)'
      );
    } while (jsExpr !== prev);

    // // → Math.trunc(a / b)
    do {
      prev = jsExpr;
      jsExpr = jsExpr.replace(
        /(-?\d+\.?\d*|[A-Za-z_]\w*|\([^()]*\))\s*\/\/\s*(-?\d+\.?\d*|[A-Za-z_]\w*|\([^()]*\))/g,
        'Math.trunc($1 / $2)'
      );
    } while (jsExpr !== prev);

    // Встроенные функции
    jsExpr = jsExpr.replace(/\bint\s*\(/g, '__int(');
    jsExpr = jsExpr.replace(/\bfloat\s*\(/g, '__float(');
    jsExpr = jsExpr.replace(/\bstr\s*\(/g, '__str(');
    jsExpr = jsExpr.replace(/\babs\s*\(/g, 'Math.abs(');
    jsExpr = jsExpr.replace(/\bround\s*\(/g, '__round(');
    jsExpr = jsExpr.replace(/\blen\s*\(/g, '__len(');
    jsExpr = jsExpr.replace(/\binput\s*\(\s*\)/g, '__input()');

    return jsExpr;
  }

  function safeEval(expr, forceFloat = false){
    const jsExpr = prepareExpr(expr);
    const names = Object.keys(vars);
    const values = names.map(n => vars[n]);

    try {
      const fn = new Function(
        ...names,
        '__pow', '__int', '__float', '__str', '__round', '__len', '__input',
        `"use strict";
         try { return (${jsExpr}); }
         catch(e){ throw new Error("Не могу вычислить: " + e.message); }`
      );
      let result = fn(
        ...values,
        (a,b) => Math.pow(a,b),
        (x) => {
          if (typeof x === 'string'){
            const n = parseFloat(x);
            if (isNaN(n)) throw new Error('int() от нечисла: ' + x);
            return Math.trunc(n);
          }
          return Math.trunc(Number(x));
        },
        (x) => Number(x),
        (x) => pyRepr(x, floatVars.has(expr.trim())),
        (x) => Math.round(x),
        (x) => (x == null) ? 0 : (typeof x === 'string' ? x.length : (Array.isArray(x) ? x.length : 0)),
        () => {
          if (stdinIndex >= stdinLines.length) return '';
          return stdinLines[stdinIndex++];
        }
      );
      
      // Если выражение содержит деление / и это не целочисленное //, считаем float
      if (/[^/]\/[^/]/.test(jsExpr)) forceFloat = true;
      // float() всегда даёт float
      if (/^__float\(/.test(jsExpr)) forceFloat = true;
      
      return { value: result, isFloat: forceFloat || !Number.isInteger(result) || /\./.test(jsExpr) && !jsExpr.includes('__int') };
    } catch (e) {
      throw new Error('Ошибка в выражении «' + expr + '»: ' + e.message);
    }
  }

  function parseFString(raw){
    // Поддержка форматов: {expr:02d}, {expr:.2f}, {expr}
    return raw.replace(/\{([^{}:]+)(?::([^{}]+))?\}/g, (_, expr, fmt) => {
      const evalRes = safeEval(expr);
      let val = evalRes.value;
      
      if (fmt) {
        // 02d — целое с ведущим нулём
        const intFmt = fmt.match(/^0?(\d+)d$/);
        if (intFmt) {
          const w = parseInt(intFmt[1], 10);
          let s = String(Math.round(Number(val)));
          if (s.length < w) s = '0'.repeat(w - s.length) + s;
          return s;
        }
        // .2f — дробное с фикс. точностью
        const floatFmt = fmt.match(/^\.(\d+)f$/);
        if (floatFmt) {
          return Number(val).toFixed(parseInt(floatFmt[1], 10));
        }
      }
      
      // Если это float-переменная или результат float-выражения
      return pyRepr(val, evalRes.isFloat);
    });
  }

  function splitTopLevel(s, sep){
    sep = sep || ',';
    const parts = [];
    let depth = 0, quote = null, buf = '';
    for (let i = 0; i < s.length; i++){
      const ch = s[i];
      if (quote){
        buf += ch;
        if (ch === quote && s[i-1] !== '\\') quote = null;
        continue;
      }
      if (ch === '"' || ch === "'"){ quote = ch; buf += ch; continue; }
      if (ch === '(' || ch === '[' || ch === '{'){ depth++; buf += ch; continue; }
      if (ch === ')' || ch === ']' || ch === '}'){ depth--; buf += ch; continue; }
      if (ch === sep && depth === 0){ parts.push(buf); buf = ''; continue; }
      buf += ch;
    }
    if (buf !== '' || parts.length) parts.push(buf);
    return parts;
  }

  const lines = code.split('\n');

  for (let rawLine of lines){
    let line = rawLine;

    // Убираем комментарии
    {
      let inQ = null, cut = -1;
      for (let i = 0; i < line.length; i++){
        const c = line[i];
        if (inQ){ if (c === inQ) inQ = null; continue; }
        if (c === '"' || c === "'"){ inQ = c; continue; }
        if (c === '#'){ cut = i; break; }
      }
      if (cut >= 0) line = line.slice(0, cut);
    }

    const trimmed = line.trim();
    if (!trimmed) continue;

    // print(...)
    const printMatch = trimmed.match(/^print\s*\((.*)\)\s*;?\s*$/s);
    if (printMatch){
      const inner = printMatch[1];
      if (!inner.trim()){
        output.push('');
        continue;
      }
      const args = splitTopLevel(inner, ',');
      const parts = args.map(arg => {
        const a = arg.trim();
        if (!a) return '';
        const fm = a.match(/^[fF](['"])([\s\S]*)\1$/);
        if (fm) return parseFString(fm[2]);
        
        const res = safeEval(a);
        return pyRepr(res.value, res.isFloat);
      });
      output.push(parts.join(' '));
      continue;
    }

    // Обмен двух переменных: a, b = b, a
    const swapMatch = trimmed.match(/^([A-Za-z_]\w*)\s*,\s*([A-Za-z_]\w*)\s*=\s*([A-Za-z_]\w*)\s*,\s*([A-Za-z_]\w*)$/);
    if (swapMatch){
      const [, a, b, c, d] = swapMatch;
      if (!(c in vars) || !(d in vars)){
        throw new Error('Переменная не определена при обмене: ' + trimmed);
      }
      const tmpA = vars[c], tmpB = vars[d];
      const fA = floatVars.has(c), fB = floatVars.has(d);
      setVar(a, tmpA, fA);
      setVar(b, tmpB, fB);
      continue;
    }

    // Присваивание
    const assignMatch = trimmed.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/s);
    if (assignMatch){
      const name = assignMatch[1];
      const exprRaw = assignMatch[2].trim();

      const fm = exprRaw.match(/^[fF](['"])([\s\S]*)\1$/);
      if (fm){
        setVar(name, parseFString(fm[2]), false);
        continue;
      }

      try {
        const res = safeEval(exprRaw);
        setVar(name, res.value, res.isFloat);
      } catch (e){
        throw new Error('Строка «' + trimmed + '»: ' + e.message);
      }
      continue;
    }

    throw new Error('Не понимаю строку: «' + trimmed + '». Поддерживаются присваивания, print() и арифметика.');
  }

  return output.join('\n');
}

/* =============================================================
   БАЗА ЗАДАЧ (20 штук)
   ============================================================= */
const TASKS = [
  { id:1, difficulty:1,
    title:"Приветствие",
    desc:'Создай переменную <code>name</code> со значением <code>"Алекс"</code>. Выведи строку: <code>Привет, Алекс!</code>',
    stdin:"",
    expectedOutput:"Привет, Алекс!",
    hints:[
      "Переменная создаётся так: <code>имя = значение</code>.",
      "Строка пишется в кавычках: <code>name = \"Алекс\"</code>.",
      "Склей две строки через <code>+</code>: <code>\"Привет, \" + name + \"!\"</code>."
    ],
    solution:'name = "Алекс"\nprint("Привет, " + name + "!")',
    starter:'# Создай переменную name и выведи приветствие\n' },

  { id:2, difficulty:1,
    title:"Сумма двух чисел",
    desc:'Создай <code>a = 5</code> и <code>b = 3</code>. Выведи: <code>5 + 3 = 8</code>',
    stdin:"",
    expectedOutput:"5 + 3 = 8",
    hints:[
      "Числа хранятся в переменных без кавычек.",
      "f-строка начинается с <code>f</code>: <code>f\"текст {выражение}\"</code>.",
      "Подставь в f-строку сами переменные и их сумму: <code>f\"{a} + {b} = {a + b}\"</code>."
    ],
    solution:'a = 5\nb = 3\nprint(f"{a} + {b} = {a + b}")',
    starter:'a = 5\nb = 3\n# Выведи через f-строку\n' },

  { id:3, difficulty:1,
    title:"Возраст",
    desc:'Создай <code>age = 15</code>. Выведи: <code>Мне 15 лет</code>',
    stdin:"",
    expectedOutput:"Мне 15 лет",
    hints:[
      "f-строка подставляет значения переменных в фигурных скобках.",
      "Формат: <code>f\"Мне {age} лет\"</code>."
    ],
    solution:'age = 15\nprint(f"Мне {age} лет")',
    starter:'age = 15\n' },

  { id:4, difficulty:1,
    title:"Обмен значений",
    desc:'Даны <code>x = 10</code> и <code>y = 20</code>. Поменяй местами и выведи:<br><code>x = 20</code><br><code>y = 10</code>',
    stdin:"",
    expectedOutput:"x = 20\ny = 10",
    hints:[
      "В Python обмен делается одной строкой: <code>x, y = y, x</code>.",
      "Выведи каждую переменную через f-строку.",

/* =============================================================
   Отрисовка карточек
   ============================================================= */
const tasksEl = document.getElementById('tasks');
const solvedCountEl = document.getElementById('solvedCount');
const totalCountEl = document.getElementById('totalCount');
const solvedSet = new Set();

totalCountEl.textContent = TASKS.length;

TASKS.forEach(t => {
  const hintsHTML = t.hints.map(h => `<li>${h}</li>`).join('');
  const diffClass = 'diff-' + t.difficulty;
  const diffLabel = ['', 'Легко', 'Средне', 'Сложно'][t.difficulty];
  const hasStdin = t.stdin && t.stdin.length > 0;

  const div = document.createElement('div');
  div.className = 'task';
  div.id = 'task-' + t.id;
  div.dataset.difficulty = t.difficulty;
  div.innerHTML = `
    <div class="task-head">
      <div class="task-title">
        <span class="num">${t.id}</span>
        ${t.title}
        <span class="difficulty ${diffClass}">${diffLabel}</span>
        ${hasStdin ? '<span class="tag-input">с вводом</span>' : ''}
      </div>
      <div id="badge-${t.id}"></div>
    </div>
    <div class="task-desc">${t.desc}</div>
    <div class="io-block">
      <div><b>Ожидаемый вывод:</b></div>
      <pre>${escapeHtml(t.expectedOutput)}</pre>
    </div>

    ${hasStdin ? `
      <div class="stdin-block">
        <label>Ввод (stdin) — по одному значению на строку:</label>
        <textarea id="stdin-${t.id}" spellcheck="false">${escapeHtml(t.stdin)}</textarea>
      </div>
    ` : ''}

    <div class="editor-wrap">
      <div class="line-numbers" id="lines-${t.id}">1</div>
      <textarea id="editor-${t.id}" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">${escapeHtml(t.starter)}</textarea>
    </div>

    <div class="actions">
      <button class="primary" data-run="${t.id}">▶ Запустить</button>
      <button class="ghost" data-reset="${t.id}">↺ Сбросить</button>
      <button class="hint-btn" data-hint="${t.id}">💡 Подсказки (${t.hints.length})</button>
      <button class="ghost" data-solution="${t.id}" style="display:none">📖 Показать решение</button>
    </div>

    <div class="hint-box" id="hint-${t.id}">
      <b>Подсказки — читай по одной:</b>
      <ol>${hintsHTML}</ol>
    </div>

    <div class="output" id="out-${t.id}"></div>

    <div class="solution-box" id="sol-${t.id}">
      <b>Пример решения:</b>
      <pre>${escapeHtml(t.solution)}</pre>
    </div>
  `;
  tasksEl.appendChild(div);
});

function escapeHtml(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

/* =============================================================
   Редакторы
   ============================================================= */
window.addEventListener('DOMContentLoaded', () => {
  TASKS.forEach(t => {
    const ta = document.getElementById('editor-' + t.id);
    const lines = document.getElementById('lines-' + t.id);

    const updateLines = () => {
      const count = ta.value.split('\n').length;
      let s = '';
      for (let i = 1; i <= count; i++) s += i + '\n';
      lines.textContent = s.replace(/\n$/, '');
    };
    const autosize = () => {
      ta.style.height = 'auto';
      ta.style.height = Math.max(130, ta.scrollHeight) + 'px';
    };

    ta.addEventListener('input', () => { updateLines(); autosize(); });
    ta.addEventListener('scroll', () => { lines.scrollTop = ta.scrollTop; });

    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab'){
        e.preventDefault();
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 4;
        updateLines(); autosize();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
        e.preventDefault();
        runTask(t.id);
      }
    });

    updateLines(); autosize();
  });

  tasksEl.addEventListener('click', (e) => {
    const run = e.target.closest('[data-run]');
    if (run) return runTask(parseInt(run.dataset.run, 10));

    const reset = e.target.closest('[data-reset]');
    if (reset){
      const id = parseInt(reset.dataset.reset, 10);
      const t = TASKS.find(x => x.id === id);
      const ta = document.getElementById('editor-' + id);
      ta.value = t.starter;
      ta.dispatchEvent(new Event('input'));
      const out = document.getElementById('out-' + id);
      out.className = 'output'; out.innerHTML = '';
      return;
    }

    const hint = e.target.closest('[data-hint]');
    if (hint){
      const id = parseInt(hint.dataset.hint, 10);
      document.getElementById('hint-' + id).classList.toggle('show');
      return;
    }

    const sol = e.target.closest('[data-solution]');
    if (sol){
      const id = parseInt(sol.dataset.solution, 10);
      document.getElementById('sol-' + id).classList.toggle('show');
      return;
    }
  });

  document.getElementById('filterBar').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    document.querySelectorAll('#filterBar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const f = b.dataset.filter;
    document.querySelectorAll('.task').forEach(task => {
      const id = parseInt(task.id.replace('task-',''));
      const diff = task.dataset.difficulty;
      const solved = solvedSet.has(id);
      let show = true;
      if (f === 'all') show = true;
      else if (f === 'solved') show = solved;
      else if (f === 'unsolved') show = !solved;
      else show = diff === f;
      task.classList.toggle('hidden', !show);
    });
  });
});

/* =============================================================
   Запуск и проверка
   ============================================================= */
function runTask(id){
  const t = TASKS.find(x => x.id === id);
  const out = document.getElementById('out-' + id);
  const code = document.getElementById('editor-' + id).value;

  if (!code.trim()){
    out.className = 'output show warn';
    out.innerHTML = `<span class="label">Пусто</span>Напиши код в редакторе.`;
    return;
  }

  const stdinEl = document.getElementById('stdin-' + id);
  const stdinText = stdinEl ? stdinEl.value : (t.stdin || "");
  const stdinLines = stdinText.split('\n');
  if (stdinLines.length && stdinLines[stdinLines.length - 1] === '') stdinLines.pop();

  let actual;
  try {
    actual = runPythonMini(code, stdinLines);
  } catch (e){
    out.className = 'output show fail';
    out.innerHTML = `<span class="label">Ошибка в коде</span>${escapeHtml(e.message)}`;
    return;
  }

  const normalize = s => String(s).replace(/\r\n/g, '\n').replace(/[ \t]+$/gm, '').trim();
  const got = normalize(actual);
  const want = normalize(t.expectedOutput);

  if (got === want){
    out.className = 'output show ok';
    out.innerHTML =
      `<span class="label">Верно!</span>` +
      `Вывод программы:<pre>${escapeHtml(got)}</pre>`;
    markSolved(id);
  } else {
    out.className = 'output show fail';
    out.innerHTML =
      `<span class="label">Не совпало</span>` +
      `Вывод твоей программы:<pre>${escapeHtml(got || '(пусто)')}</pre>` +
      `Ожидалось:<pre>${escapeHtml(want)}</pre>`;
  }
}

function markSolved(id){
  if (solvedSet.has(id)) return;
  solvedSet.add(id);
  document.getElementById('task-' + id).classList.add('solved');
  document.getElementById('badge-' + id).innerHTML =
    `<span class="badge-solved">✓ решено</span>`;
  const solBtn = document.querySelector(`[data-solution="${id}"]`);
  if (solBtn) solBtn.style.display = 'inline-block';
  solvedCountEl.textContent = solvedSet.size;
}
